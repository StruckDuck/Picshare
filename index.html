    --parchment: #C8B090;
    --lith: #C05020;
    --faded: #304050;
  }

    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: Georgia, "Times New Roman", serif;
  }
  header { padding: 28px 20px 16px; text-align: center; }
  header svg { display: block; margin: 0 auto; height: 100px; width: auto; max-width: 60%; }

    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  figure { margin: 0; }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid #2c261d;
  }
  button {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    font: 600 16px Georgia, serif;
    letter-spacing: .04em;
    color: var(--ink);
    background: var(--lith);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  button:active { background: var(--parchment); }
  .hint {
    text-align: center;
    color: var(--parchment);
    font-size: 14px;
    margin: 0 0 24px;
  }
</style>

<p class="hint">Tap Save under a photo, then choose Save Image.</p>

<main id="gallery"></main>

<script>
  // Photos are found automatically from the assets folder in your GitHub repo.
  // Auto-detects owner/repo from a github.io address. If you use a custom domain,
  // fill these in (example: OWNER = "joshstacy", REPO = "photos").
  const OWNER = "";
  const REPO = "";
  const FOLDER = "assets";
  // Used only if the lookup fails (offline, rate limited, not on GitHub Pages).
  const FALLBACK = [];

  const gallery = document.getElementById("gallery");
  const IMG = /\.(jpe?g|png|webp|gif|heic)$/i;

  function repoInfo() {
    if (OWNER && REPO) return { owner: OWNER, repo: REPO };
    const host = location.hostname;
    if (host.endsWith(".github.io")) {
      const owner = host.split(".")[0];
      const repo = location.pathname.split("/")[1] || (owner + ".github.io");
      return { owner, repo };
    }
    return null;
  }

  async function listPhotos() {
    const info = repoInfo();
    if (!info) return FALLBACK;
    try {
      const url = "https://api.github.com/repos/" + info.owner + "/" + info.repo + "/contents/" + FOLDER;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const items = await res.json();
      return items.filter(i => i.type === "file" && IMG.test(i.name)).map(i => i.name).reverse();
    } catch (e) {
      return FALLBACK;
    }
  }

  function render(names) {
    names.forEach(name => {
      const src = FOLDER + "/" + name;
      const fig = document.createElement("figure");

      const img = document.createElement("img");
      img.src = src;
      img.alt = "";
      img.loading = "lazy";
      img.onerror = () => fig.remove();

      const btn = document.createElement("button");
      btn.textContent = "Save";
      btn.addEventListener("click", () => save(src, name));

      fig.append(img, btn);
      gallery.append(fig);
    });
  }

  listPhotos().then(render);

  async function save(src, name) {
    try {
      const res = await fetch(src);
      const blob = await res.blob();
      const file = new File([blob], name, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
    const a = document.createElement("a");
    a.href = src;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
</script>
